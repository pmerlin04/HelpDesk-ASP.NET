<!DOCTYPE html>
<html>
<head>
  <title>Teste Google Token</title>
  <!-- Script do Google -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h2>Teste de Token do Google</h2>
  
  <!-- Div onde o botão do Google vai aparecer -->
  <div id="g_id_onload"
       data-client_id="946978224464-f6fhhdc522v76gf8eo5gstmkfu9q0nnc.apps.googleusercontent.com"
       data-callback="manipularRespostaGoogle">
  </div>
  
  <div class="g_id_signin" data-type="standard"></div>

  <script>
    function manipularRespostaGoogle(response) {
      // 1. Exibe no Console do navegador (F12) o Token REAL que o Google gerou
      console.log("=== TOKEN REAL DO GOOGLE ===");
      console.log(response.credential);
      console.log("============================");

      alert("Token gerado! Abra o Console (F12) e copie o token para testar no Postman/Swagger!");
    }
  </script>
</body>
</html>
